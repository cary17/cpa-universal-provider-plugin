name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, ext: so, runner: ubuntu-24.04}
          - {goos: linux, goarch: arm64, ext: so, runner: ubuntu-24.04-arm}
          - {goos: darwin, goarch: amd64, ext: dylib, runner: macos-15-intel}
          - {goos: darwin, goarch: arm64, ext: dylib, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate tag and build archive
        env:
          TAG: ${{ github.ref_name }}
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release tag" >&2; exit 1; }
          version="${TAG#v}"
          [[ "$version" == "0.1.1" ]] || { echo "tag version does not match embedded plugin version 0.1.1" >&2; exit 1; }
          mkdir -p dist/stage .gotmp
          export GOTMPDIR="$PWD/.gotmp"
          go test -count=1 ./...
          go vet ./...
          CGO_ENABLED=1 GOOS="$TARGET_GOOS" GOARCH="$TARGET_GOARCH" go build -buildmode=c-shared -trimpath -o "dist/stage/universal-provider.$EXT" .
          rm -f dist/stage/universal-provider.h
          archive="universal-provider_${version}_${TARGET_GOOS}_${TARGET_GOARCH}.zip"
          (cd dist/stage && zip -9 "../$archive" "universal-provider.$EXT")
          rm -rf dist/stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum *.zip > checksums.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.zip
            dist/checksums.txt
          fail_on_unmatched_files: true
