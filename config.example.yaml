# Merge under CPA's main configuration. The library filename must be universal-provider.so/.dylib.
plugins:
  enabled: true
  dir: plugins
  configs:
    universal-provider:
      enabled: true
      priority: 100
      providers:
        - id: primary
          name: Primary OpenAI
          enabled: true
          protocol: openai # openai / openai-response / claude / gemini
          base-url: https://api.example.com/v1
          headers:
            X-Organization: example
          api-key-entries:
            - api-key: replace-with-secret
              weight: 3
            - api-key: replace-with-another-secret
              weight: 1
          models:
            - name: upstream-model-id
              alias: public-model
              display-name: Example Model
              max-context-length: 128000
              input-modalities: [text, image]
              output-modalities: [text]
          image-generation: false
          # auto/none/minimal/low/medium/high/xhigh/max
          reasoning-effort: auto
        - id: backup-claude
          name: Backup Claude
          enabled: false
          protocol: claude
          base-url: https://api.anthropic.com/v1
          headers: {}
          api-key-entries:
            - api-key: replace-with-secret
          models:
            - name: claude-model-id
              alias: backup-model
              input-modalities: [text, image]
              output-modalities: [text]
          image-generation: false
          reasoning-effort: max
